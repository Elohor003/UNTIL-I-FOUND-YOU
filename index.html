
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090907">
<title>A Little Question</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --gold: #e8bd73;
  --light-gold: #ffe3a7;
  --cream: #f6eddb;
  --muted: #a99a7f;
  --bg: #090907;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--cream);
  font-family: 'DM Sans', sans-serif;
}

body {
  min-height: 100svh;
}

#scene {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 52%, #332515 0%, #17120c 30%, #090907 75%);
}

#particles {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse, transparent 35%, rgba(0,0,0,.65) 100%);
}

.grain {
  position: absolute;
  inset: 0;
  opacity: .055;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}

.content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}

.eyebrow {
  color: var(--gold);
  font-size: 9px;
  letter-spacing: 5px;
  text-transform: uppercase;
  opacity: 0;
  animation: fadeUp 1.4s 1s forwards;
}

#flower {
  width: min(72vw, 410px);
  height: min(72vw, 410px);
  overflow: visible;
  filter: drop-shadow(0 0 22px rgba(226,174,92,.18));
}

.intro {
  margin-top: 8px;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(25px, 5vw, 39px);
  font-weight: 300;
  letter-spacing: 1px;
  color: var(--cream);
  opacity: 0;
  transform: translateY(15px);
  animation: fadeUp 1.5s 3.5s forwards;
}

.subintro {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: 13px;
  opacity: 0;
  animation: fadeUp 1.5s 4.2s forwards;
}

#invitation {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px;
  opacity: 0;
  visibility: hidden;
  transform: scale(.96);
  transition: opacity 1.5s, transform 1.5s, visibility 1.5s;
}

#invitation.show {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
}

.question-small {
  color: var(--gold);
  font-size: 9px;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 25px;
}

.question {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(42px, 9vw, 78px);
  font-weight: 300;
  line-height: 1.04;
  max-width: 750px;
  margin: 0;
  color: var(--cream);
}

.question em {
  color: var(--light-gold);
  font-weight: 400;
}

.question-note {
  color: #ad9b7d;
  font-size: 12px;
  letter-spacing: 1px;
  margin-top: 23px;
}

.buttons {
  display: flex;
  gap: 16px;
  margin-top: 44px;
  align-items: center;
  justify-content: center;
}

.choice {
  border: 1px solid rgba(232,189,115,.55);
  border-radius: 100px;
  padding: 15px 37px;
  min-width: 125px;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: .35s ease;
}

#yes {
  background: linear-gradient(135deg, #f1d49b, #c38b42);
  color: #21180c;
  border: none;
  box-shadow: 0 0 25px rgba(218,170,92,.16);
}

#yes:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 38px rgba(218,170,92,.4);
}

#no {
  background: transparent;
  color: var(--cream);
}

#no:hover {
  background: rgba(232,189,115,.1);
  border-color: var(--light-gold);
}

.reaction {
  color: var(--gold);
  font-family: 'Cormorant Garamond', serif;
  font-size: 23px;
  min-height: 32px;
  margin-top: 24px;
  opacity: 0;
  transition: opacity .5s;
}

.reaction.visible { opacity: 1; }

#celebration {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px;
  text-align: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1.5s, visibility 1.5s;
  background: radial-gradient(ellipse at center, rgba(114,77,33,.23), transparent 70%);
}

#celebration.show {
  opacity: 1;
  visibility: visible;
}

.celebration-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(52px, 12vw, 100px);
  font-weight: 300;
  line-height: 1;
  color: var(--light-gold);
  text-shadow: 0 0 35px rgba(230,181,103,.25);
}

.celebration-sub {
  color: var(--cream);
  font-size: 12px;
  letter-spacing: 2px;
  margin-top: 25px;
}

.heart {
  color: var(--gold);
  font-size: 29px;
  margin-top: 32px;
  animation: heartbeat 1.5s infinite;
}

.signature {
  position: absolute;
  bottom: 28px;
  font-size: 9px;
  letter-spacing: 4px;
  color: #9b8767;
  text-transform: uppercase;
}

#musicButton {
  position: absolute;
  top: 23px;
  right: 23px;
  z-index: 10;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(232,189,115,.25);
  border-radius: 50px;
  padding: 10px 14px;
  color: var(--gold);
  font-size: 9px;
  letter-spacing: 1px;
  cursor: pointer;
}

#restart {
  background: transparent;
  border: 1px solid rgba(232,189,115,.5);
  color: var(--gold);
  border-radius: 30px;
  padding: 13px 25px;
  margin-top: 35px;
  cursor: pointer;
  letter-spacing: 2px;
  font-size: 9px;
}

.hidden { display: none !important; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.22); }
}

@media(max-width: 500px) {
  .buttons { gap: 10px; }
  .choice { min-width: 110px; padding: 14px 23px; }
  .question-note { max-width: 280px; line-height: 1.7; }
}
</style>
</head>

<body>
<div id="scene">
  <canvas id="particles"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <button id="musicButton">♫ SOUND OFF</button>

  <div class="content" id="opening">
    <div class="eyebrow">A little moment of magic</div>

    <svg id="flower" viewBox="0 0 400 400" aria-label="A glowing golden flower">
      <defs>
        <radialGradient id="petal">
          <stop offset="0%" stop-color="#fff0c8"/>
          <stop offset="55%" stop-color="#e8bd73"/>
          <stop offset="100%" stop-color="#a56a2c"/>
        </radialGradient>
        <radialGradient id="centre">
          <stop offset="0%" stop-color="#fff1bd"/>
          <stop offset="60%" stop-color="#d49a4d"/>
          <stop offset="100%" stop-color="#75451d"/>
        </radialGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <g id="stem" opacity="0">
        <path d="M200 212 Q198 280 201 365" fill="none"
          stroke="#b38b50" stroke-width="3" stroke-linecap="round"/>
        <path d="M200 310 Q150 264 120 290 Q145 330 200 320"
          fill="#b68b4c" opacity=".7"/>
        <path d="M201 338 Q247 290 281 312 Q260 348 201 348"
          fill="#a47a42" opacity=".7"/>
      </g>

      <g id="petals" transform="translate(200 190)">
        <g id="petalGroup" filter="url(#glow)"></g>
        <circle r="25" fill="url(#centre)" opacity="0" id="flowerCentre"/>
      </g>
    </svg>

    <div class="intro">Some things are worth asking...</div>
    <div class="subintro">Wait for it</div>
  </div>

  <section id="invitation">
    <div class="question-small">A question for you</div>
    <h1 class="question">Will you go on a<br><em>date with me?</em></h1>
    <div class="question-note">I promise it'll be worth saying yes to. ✨</div>

    <div class="buttons">
      <button class="choice" id="yes">YES ♥</button>
      <button class="choice" id="no">NO</button>
    </div>
    <div class="reaction" id="reaction"></div>
  </section>

  <section id="celebration">
    <div class="question-small">Well, look at that...</div>
    <div class="celebration-title">It's a YES!</div>
    <div class="celebration-sub">You've just made someone's day. ♡</div>
    <div class="heart">✦</div>
    <button id="restart">EXPERIENCE AGAIN ↗</button>
  </section>

  <div class="signature">Made with a little golden magic</div>
</div>

<!-- Optional: place a legally obtained audio file named golden-hour.mp3
     in this same folder. Browsers require a user gesture before playback. -->
<audio id="music" loop>
  <source src="golden-hour.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

let W, H, particles = [], animationFrame;
let started = false;
let yesChosen = false;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();
window.addEventListener('resize', resize);

const random = (a,b) => Math.random() * (b-a) + a;

class Particle {
  constructor() { this.reset(true); }

  reset(initial = false) {
    this.x = random(0, window.innerWidth);
    this.y = initial ? random(0, window.innerHeight) : window.innerHeight + 10;
    this.size = random(.4, 2);
    this.speed = random(.15, .65);
    this.alpha = random(.15, .8);
    this.twinkle = random(0, Math.PI * 2);
  }

  update() {
    this.y -= this.speed;
    this.twinkle += .025;
    if (this.y < -10) this.reset();
  }

  draw() {
    const glow = this.alpha * (.6 + Math.sin(this.twinkle)*.4);
    ctx.fillStyle = `rgba(239,193,119,${glow})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
  }
}

for(let i=0;i<150;i++) particles.push(new Particle());

function animateParticles() {
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);

  particles.forEach(p => {
    p.update();
    p.draw();
  });

  if (yesChosen) {
    // A little extra golden sparkle during the celebration.
    for(let i=0;i<2;i++) {
      const x = random(0,window.innerWidth);
      const y = random(0,window.innerHeight);
      ctx.fillStyle = `rgba(255,215,147,${random(.2,.8)})`;
      ctx.beginPath();
      ctx.arc(x,y,random(1,2.5),0,Math.PI*2);
      ctx.fill();
    }
  }

  animationFrame = requestAnimationFrame(animateParticles);
}
animateParticles();

// Build the flower petals.
const group = document.getElementById('petalGroup');
const NS = 'http://www.w3.org/2000/svg';

for(let i=0;i<12;i++) {
  const petal = document.createElementNS(NS,'ellipse');
  petal.setAttribute('cx','0');
  petal.setAttribute('cy','-53');
  petal.setAttribute('rx','17');
  petal.setAttribute('ry','49');
  petal.setAttribute('fill','url(#petal)');
  petal.setAttribute('transform',`rotate(${i*30}) scale(0.01)`);
  petal.style.transformOrigin = '0px 0px';
  petal.style.opacity = '0';
  petal.style.transition = `transform 1.6s cubic-bezier(.2,.8,.2,1), opacity 1.3s`;
  group.appendChild(petal);

  setTimeout(() => {
    petal.style.opacity = '.96';
    petal.setAttribute('transform',`rotate(${i*30}) scale(1)`);
  }, 1400 + i*120);
}

setTimeout(() => {
  document.getElementById('stem').style.transition = 'opacity 2s';
  document.getElementById('stem').style.opacity = '1';
}, 1700);

setTimeout(() => {
  document.getElementById('flowerCentre').style.transition = 'opacity 1.5s';
  document.getElementById('flowerCentre').style.opacity = '1';
}, 3000);

// Reveal the question.
setTimeout(() => {
  document.getElementById('opening').style.transition = 'opacity 1.5s';
  document.getElementById('opening').style.opacity = '0';

  setTimeout(() => {
    document.getElementById('opening').style.display = 'none';
    document.getElementById('invitation').classList.add('show');
  }, 1500);
}, 6800);

// NO reactions.
const noButton = document.getElementById('no');
const reaction = document.getElementById('reaction');

const noMessages = [
  "Are you sure? 🥺",
  "I'll pretend I didn't see that. 😂",
  "Not even a tiny YES? 🥹",
  "Okay, I'll give you another chance. 🤭",
  "You really enjoy suspense, huh?"
];

let noCount = 0;

noButton.addEventListener('click', () => {
  if (yesChosen) return;
  reaction.textContent = noMessages[noCount % noMessages.length];
  reaction.classList.add('visible');
  noCount++;
});

// YES celebration.
document.getElementById('yes').addEventListener('click', () => {
  if (yesChosen) return;
  yesChosen = true;

  document.getElementById('invitation').classList.remove('show');

  setTimeout(() => {
    document.getElementById('celebration').classList.add('show');
  }, 650);

  // Golden burst.
  for(let i=0;i<100;i++) {
    const p = new Particle();
    p.x = window.innerWidth/2 + random(-40,40);
    p.y = window.innerHeight/2 + random(-40,40);
    p.speed = random(.5,2);
    particles.push(p);
  }
});

// Music control.
const music = document.getElementById('music');
const musicButton = document.getElementById('musicButton');
let musicPlaying = false;

musicButton.addEventListener('click', async () => {
  if (!musicPlaying) {
    try {
      await music.play();
      musicPlaying = true;
      musicButton.textContent = '♫ SOUND ON';
    } catch {
      musicButton.textContent = 'ADD MUSIC FILE';
    }
  } else {
    music.pause();
    musicPlaying = false;
    musicButton.textContent = '♫ SOUND OFF';
  }
});

// Restart the experience.
document.getElementById('restart').addEventListener('click', () => {
  location.reload();
});
</script>
</body>
</html>
