 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Until I Found You ✨</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400&display=swap');

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#071323;color:#fff;font-family:'Montserrat',sans-serif}
#film{position:relative;width:100%;height:100%;min-height:560px;overflow:hidden;background:linear-gradient(#071323 0%,#102941 54%,#263c42 100%)}
.sky{position:absolute;inset:0;background:radial-gradient(ellipse at 75% 22%,#30475c 0%,transparent 34%),linear-gradient(180deg,#071323,#122a40 70%,#263c42)}
.moon{position:absolute;width:clamp(105px,17vw,190px);height:clamp(105px,17vw,190px);border-radius:50%;right:15%;top:9%;background:radial-gradient(circle at 35% 30%,#fff 0%,#f5f0dc 35%,#d4d9d3 72%,#a9b9bd 100%);box-shadow:0 0 35px #e8f0e6aa,0 0 100px #c5d9df55;animation:moonGlow 5s ease-in-out infinite alternate}
.moon:after{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle at 25% 55%,#b5c1c0 0 2%,transparent 3%),radial-gradient(circle at 65% 30%,#b5c1c0 0 3%,transparent 4%),radial-gradient(circle at 55% 70%,#c2ccca 0 4%,transparent 5%);opacity:.5}
@keyframes moonGlow{to{box-shadow:0 0 55px #e8f0e6cc,0 0 130px #c5d9df77}}
.stars{position:absolute;inset:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;box-shadow:0 0 8px #fff;animation:twinkle 2.5s infinite alternate}
@keyframes twinkle{to{opacity:.18;transform:scale(.5)}}
.cloud{position:absolute;width:260px;height:65px;background:#8b9ca7;filter:blur(30px);opacity:.12;border-radius:50%;animation:cloudDrift 35s linear infinite}
.cloud.one{top:24%;left:-280px}.cloud.two{top:43%;left:-320px;animation-delay:-17s;opacity:.08}
@keyframes cloudDrift{to{transform:translateX(150vw)}}
.hills{position:absolute;bottom:18%;width:100%;height:36%;background:#142d36;clip-path:polygon(0 60%,12% 35%,24% 53%,37% 20%,52% 52%,67% 24%,81% 48%,92% 27%,100% 43%,100% 100%,0 100%);opacity:.75}
.hills.back{bottom:20%;height:31%;background:#1c3940;transform:scaleX(-1);opacity:.7}
.ground{position:absolute;bottom:-8%;width:100%;height:39%;background:radial-gradient(ellipse at 50% 0%,#52605a 0%,#233c3b 35%,#0a1c29 82%);border-radius:50% 50% 0 0}
.path{position:absolute;bottom:-14%;left:36%;width:36%;height:47%;background:linear-gradient(90deg,#a5a99b22,#d5d1b055,#a5a99b22);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(3px)}
.lake{position:absolute;bottom:23%;left:8%;width:35%;height:7%;border-radius:50%;background:linear-gradient(180deg,#9baeb0aa,#627d83aa);filter:blur(8px);opacity:.55}
.tree{position:absolute;bottom:19%;width:0;height:0;border-left:50px solid transparent;border-right:50px solid transparent;border-bottom:190px solid #102b2b;filter:drop-shadow(8px 8px 7px #06131c)}
.tree:after{content:"";position:absolute;top:135px;left:-8px;width:16px;height:95px;background:#172927}
.tree.t1{left:3%;transform:scale(.9)}.tree.t2{left:84%;transform:scale(1.2)}.tree.t3{left:74%;transform:scale(.7)}
.firefly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe6a0;box-shadow:0 0 12px 4px #f5d58b88;animation:fly 8s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(35px,-65px);opacity:.4}}
.flowers{position:absolute;bottom:15%;left:0;width:100%;height:15%;background:radial-gradient(ellipse at 10% 60%,#a8b18b 0 2px,transparent 3px),radial-gradient(ellipse at 17% 35%,#e0d8b1 0 3px,transparent 4px),radial-gradient(ellipse at 83% 50%,#e0d8b1 0 3px,transparent 4px),radial-gradient(ellipse at 93% 20%,#a8b18b 0 2px,transparent 3px)}
#sceneText{position:absolute;z-index:8;top:8%;left:8%;width:45%;max-width:490px;pointer-events:none;animation:textIn 2s both}
@keyframes textIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.kicker{font-size:9px;letter-spacing:5px;text-transform:uppercase;color:#d8c99f;margin-bottom:18px}
h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(37px,6vw,76px);line-height:.98;margin:0;color:#f6f0df;text-shadow:0 3px 30px #071323}
#subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(17px,2.2vw,25px);color:#d5d9d2;margin-top:18px;line-height:1.3;max-width:370px}
#couple{position:absolute;z-index:5;bottom:13%;left:50%;width:min(590px,80vw);height:min(460px,60vh);transform:translateX(-50%)}
.person{position:absolute;bottom:0;width:42%;height:100%;transition:transform 2s ease}
#boy{left:0;transform:translateX(-100%)}
#girl{right:0;transform:translateX(100%)}
#boy svg,#girl svg{width:100%;height:100%;overflow:visible}
.person .shadow{position:absolute;bottom:1%;left:15%;width:70%;height:5%;background:#06121a88;border-radius:50%;filter:blur(8px)}
#boy.enter{transform:translateX(20%)}
#girl.enter{transform:translateX(-20%)}
#boy.close{transform:translateX(39%)}
#girl.close{transform:translateX(-39%)}
#boy.dance{animation:boyDance 3s ease-in-out infinite}
#girl.dance{animation:girlDance 3s ease-in-out infinite}
@keyframes boyDance{50%{transform:translateX(34%) rotate(-3deg) translateY(-8px)}}
@keyframes girlDance{50%{transform:translateX(-34%) rotate(3deg) translateY(-10px)}}
.hand{transform-origin:50% 10%;animation:handWave 3s ease-in-out infinite}
@keyframes handWave{50%{transform:rotate(-9deg)}}
.petals{position:absolute;inset:0;pointer-events:none;z-index:7}
.petal{position:absolute;top:-20px;width:8px;height:13px;background:#e8dfc2;border-radius:90% 0 90% 0;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translate(100px,110vh) rotate(500deg)}}
#vignette{position:absolute;inset:0;z-index:9;pointer-events:none;background:radial-gradient(ellipse,transparent 45%,#02091299 100%)}
#endMessage{position:absolute;z-index:12;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:#061321b8;backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity 3s}
#endMessage.show{opacity:1}
#endMessage h2{font:400 clamp(42px,8vw,85px)/1 'Cormorant Garamond',serif;color:#f4eddb;margin:0 20px}
#endMessage p{font:italic 21px 'Cormorant Garamond',serif;color:#d7cba9;margin-top:18px}
#replay{position:absolute;z-index:15;bottom:22px;right:24px;background:#e5ddc5;color:#142638;border:0;border-radius:30px;padding:11px 18px;font:10px 'Montserrat';letter-spacing:2px;cursor:pointer;opacity:.8}
#replay:hover{opacity:1}
@media(max-width:600px){
 #sceneText{top:8%;left:7%;width:80%}
 .kicker{font-size:8px}
 #couple{width:95vw;height:43vh;bottom:17%}
 .tree{transform:scale(.65)}.tree.t2{transform:scale(.8)}
 .lake{width:50%;left:0}
}
</style>
</head>
<body>

 <div class="moon"></div>
 <div class="cloud one"></div><div class="cloud two"></div>
 <div class="stars" id="stars"></div>
 <div class="hills back"></div><div class="hills"></div>
 <div class="lake"></div><div class="ground"></div><div class="path"></div>
 <div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div>
 <div class="flowers"></div>
 <div id="sceneText">
  <div class="kicker">A story written in the stars</div>
  <h1 id="heading">Somewhere<br>under the same sky</h1>
  <div id="subtitle">Two hearts. Two different paths. One beautiful moment waiting to happen.</div>

  </div>
  <div class="person" id="girl">
   <div class="shadow"></div>
   <svg viewBox="0 0 240 440" xmlns="http://www.w3.org/2000/svg">

     <linearGradient id="skinF" x2="1" y2="1"><stop stop-color="#d99a75"/><stop offset=".55" stop-color="#b87555"/><stop offset="1" stop-color="#8d563e"/></linearGradient>

 <div id="endMessage">
  <h2>And then, there was you.</h2>
  <p>In every lifetime, I would find you again.</p>
 </div>
 <div id="vignette"></div>
 <button id="replay" onclick="replay()">REPLAY THE STORY ↗</button>
</div>
<script>
const stars=document.getElementById('stars');
for(let i=0;i<110;i++){
 const s=document.createElement('i');s.className='star';
 s.style.left=Math.random()*100+'%';s.style.top=Math.random()*72+'%';
 s.style.animationDelay=Math.random()*4+'s';
 s.style.opacity=.25+Math.random()*.75;
 stars.appendChild(s);
}
const fireflies=Array.from({length:24},(_,i)=>{
 const f=document.createElement('i');f.className='firefly';
 f.style.left=(5+Math.random()*90)+'%';
 f.style.top=(45+Math.random()*43)+'%';
 f.style.animationDelay=(-Math.random()*8)+'s';
 f.style.animationDuration=(5+Math.random()*8)+'s';
 document.getElementById('film').appendChild(f);
});
const petals=document.getElementById('petals');
for(let i=0;i<22;i++){
 const p=document.createElement('i');p.className='petal';
 p.style.left=Math.random()*100+'%';
 p.style.animationDuration=(9+Math.random()*13)+'s';
 p.style.animationDelay=(-Math.random()*20)+'s';
 petals.appendChild(p);
}
const boy=document.getElementById('boy');
const girl=document.getElementById('girl');
const heading=document.getElementById('heading');
const subtitle=document.getElementById('subtitle');
const end=document.getElementById('endMessage');
let timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function text(h,s){
 heading.innerHTML=h;subtitle.textContent=s;
 const t=document.getElementById('sceneText');
 t.style.animation='none';void t.offsetWidth;t.style.animation='textIn 2s both';
}
function play(){
 timers.forEach(clearTimeout);timers=[];
 boy.className='person';girl.className='person';end.classList.remove('show');
 text('Somewhere<br>under the same sky','Two hearts. Two different paths. One beautiful moment waiting to happen.');
 later(()=>text('Before they met...','The stars were already writing a story neither of them knew.'),6500);
 later(()=>{boy.classList.add('enter');text('A chance encounter','He followed a quiet path beneath the moonlight.' )},12500);
 later(()=>{girl.classList.add('enter');text('And then, she appeared','Some moments feel like they have been waiting forever.' )},19000);
 later(()=>text('A familiar feeling','For a moment, the whole world seemed to grow quiet.'),26000);
 later(()=>{boy.classList.add('close');girl.classList.add('close');text('A little closer','Somehow, the distance between two strangers began to disappear.')},33000);
 later(()=>text('The beginning of everything','A smile. A glance. A feeling neither could explain.'),41000);
 later(()=>{boy.classList.add('dance');girl.classList.add('dance');text('Under a thousand stars','And suddenly, they had their own little universe.')},49000);
 later(()=>{text('If the stars could speak...','They would tell you that some people are worth finding.')},57000);
 later(()=>{end.classList.add('show')},65000);
}
function replay(){play()}
play();
</script>
</body>
</html>
